spring.application.name=miniflow
server.port=${MINIFLOW_PORT:8080}
spring.jackson.serialization.indent-output=true
spring.jackson.use-jackson2-defaults=true

# Database. The default is an embedded H2 file under ./data; use the "postgres" profile for PostgreSQL.
spring.datasource.url=${MINIFLOW_DB_URL:jdbc:h2:file:./data/miniflow}
spring.datasource.username=${MINIFLOW_DB_USERNAME:sa}
spring.datasource.password=${MINIFLOW_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=${MINIFLOW_H2_CONSOLE:false}

# Language of the UI and of scheduled runs (en or tr). Users can switch with EN | TR.
miniflow.default-locale=${MINIFLOW_DEFAULT_LOCALE:en}
spring.messages.basename=messages
spring.messages.fallback-to-system-locale=false

miniflow.execution-retention-days=${MINIFLOW_EXECUTION_RETENTION_DAYS:14}
miniflow.seed-examples=${MINIFLOW_SEED_EXAMPLES:true}
miniflow.seed-location=${MINIFLOW_SEED_LOCATION:classpath:workflows/*.json}

# Key used to encrypt stored credentials. When empty, ./data/encryption.key is generated on first start.
# Set MINIFLOW_ENCRYPTION_KEY in production and keep it safe: without it credentials cannot be decrypted.
miniflow.encryption-key=${MINIFLOW_ENCRYPTION_KEY:}

# Folder the File node may list and read (PDF, Word, text). Empty disables the File node.
miniflow.files-dir=${MINIFLOW_FILES_DIR:}

# Initial values for {{ vars.* }}. They are copied into the Variables page only when it is empty;
# afterwards the Variables page is the source of truth. Never put secrets here: use Credentials.
# Any variable can also be provided as an environment variable, e.g. MINIFLOW_VARS_GITHUBTOKEN.
miniflow.vars[watchUrl]=https://example.com
miniflow.vars[healthCheckUrl]=https://example.com
miniflow.vars[alertWebhook]=https://httpbin.org/post
miniflow.vars[githubUser]=octocat
miniflow.vars[githubRepo]=octocat/Hello-World
miniflow.vars[githubWatchRepo]=spring-projects/spring-boot
